name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      # Os testes não usam o TensorFlow (só o comando `anomalias` usa), então ele fica de fora aqui.
      - run: pip install numpy xarray netCDF4 spectral rasterio scikit-learn matplotlib
      - run: python -m unittest discover -s tests -v
      - run: python -m anna --help
